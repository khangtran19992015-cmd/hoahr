<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PHAM THI HOA – Demo</title>
<style>
:root{--navy:#0b2447;--em:#10b981;--em2:#059669;--bg:#f6f9fc;--card:#fff;--tx:#0f1b33;--mu:#5b6b84;--bd:#e3eaf3;--soft:#e8f8f1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08142a;--card:#0f2040;--tx:#eaf1fb;--mu:#9fb0c8;--bd:#1f3358;--soft:#0c3a33}}
:root[data-theme="dark"]{--bg:#08142a;--card:#0f2040;--tx:#eaf1fb;--mu:#9fb0c8;--bd:#1f3358;--soft:#0c3a33}
*{box-sizing:border-box}html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit;text-decoration:none}
.w{max-width:1100px;margin:auto;padding:0 18px}
.banner{background:#f59e0b;color:#1b1200;text-align:center;font-size:13px;padding:6px 10px;font-weight:600}
header{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff}
.nav{display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{font-weight:800;letter-spacing:.5px}.logo b{color:var(--em)}
nav{display:flex;gap:4px}nav a{padding:8px 11px;border-radius:8px;font-size:14px;color:#cfe0f5}
nav a:hover,nav a.on{background:rgba(16,185,129,.2);color:#fff}
.burger{display:none;background:none;border:0;color:#fff;font-size:26px}
@media(max-width:900px){.burger{display:block}nav{display:none;position:absolute;top:60px;left:0;right:0;background:var(--navy);flex-direction:column;padding:10px 18px}nav.open{display:flex}}
.btn{display:inline-block;background:var(--em);color:#04281c;font-weight:700;border:0;border-radius:10px;padding:11px 20px;cursor:pointer;font-size:15px}
.btn:hover{background:var(--em2);color:#fff}.btn.o{background:none;border:2px solid #fff;color:#fff}.btn.d{background:var(--navy);color:#fff}
.hero{background:linear-gradient(135deg,#0b2447,#0d4a52 70%,#10b981);color:#fff;padding:64px 0}
.hero h1{font-size:clamp(28px,5vw,46px);line-height:1.2;margin:0 0 14px}.hero p{max-width:600px;color:#d5e6f7}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;transition:.2s}
.card:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(11,36,71,.12)}
.ic{width:46px;height:46px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:22px;margin-bottom:10px}
section{padding:40px 0}h2{font-size:28px;margin:0 0 6px}.sub{color:var(--mu);margin:0 0 22px}
.tag{display:inline-block;font-size:12px;background:var(--soft);color:var(--em2);padding:2px 10px;border-radius:99px;font-weight:700}
.mu{color:var(--mu);font-size:14px}.stats{display:flex;gap:28px;flex-wrap:wrap;margin-top:26px}.stats b{font-size:26px;color:var(--em);display:block}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;margin:4px 0 12px}
label{font-size:14px;font-weight:600}.res{background:var(--soft);border-radius:12px;padding:14px;margin-top:8px}
.res div{display:flex;justify-content:space-between;padding:3px 0}.res .t{font-weight:800;border-top:1px solid var(--bd);margin-top:6px;padding-top:8px;color:var(--em2)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tabs button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:99px;cursor:pointer}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.bar{height:10px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--em);transition:width .4s}
.les{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd);cursor:pointer}.les input{width:auto;margin:0}
footer{background:var(--navy);color:#b9cbe3;padding:34px 0;margin-top:30px;font-size:14px}footer b{color:#fff}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.3s;z-index:50;max-width:90%}
#toast.s{opacity:1}
@keyframes fi{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
#app>*,.grid>*,.two>*{animation:fi .55s ease backwards}
.grid>*:nth-child(2){animation-delay:.08s}.grid>*:nth-child(3){animation-delay:.16s}.grid>*:nth-child(4){animation-delay:.24s}.grid>*:nth-child(5){animation-delay:.32s}.grid>*:nth-child(n+6){animation-delay:.4s}
#app.nf *{animation:none!important}
nav.open{animation:fi .25s ease}
.btn{transition:.2s}.btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(16,185,129,.35)}.btn:active{transform:scale(.97)}
.les{transition:padding .2s,background .2s}.les:hover{padding-left:8px;background:var(--soft)}
.av{animation:fl 3s ease-in-out infinite}
.bar i{transition:width .6s ease}
#st{position:fixed;inset:0;pointer-events:none;z-index:60}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.two{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.av{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--navy),var(--em));color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px}
</style>
</head>
<body>

<header><div class="w nav"><a href="#home" class="logo">HOA HR <b>ACADEM</b></a><button class="burger" id="bg" aria-label="Menu">☰</button><nav id="nv"></nav></div></header>
<main id="app"></main>
<footer><div class="w two"><div><b>HOA HR ACADEM</b><br>Đào tạo &amp; coaching thực chiến cho HR Newbie.<br>Chủ sở hữu: Phạm Thị Hoa</div><div>📍 Tân An Hội, Củ Chi, TP.HCM<br>📞 090x xxx xxx (mẫu) · ✉ hello@hoahracadem.demo<br>© 2026 – Bản demo thiết kế</div></div></footer>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s),fmt=n=>Math.round(n).toLocaleString("vi-VN")+" ₫";
const T=m=>{const t=$("#toast");t.textContent=m;t.classList.add("s");setTimeout(()=>t.classList.remove("s"),2600)};
const NAV=[["home","Trang chủ"],["courses","Khóa học"],["library","Thư viện"],["toolkit","Toolkit"],["coaching","Coaching 1:1"],["blog","Blog"],["student","Học viên"]];
const COURSES=[["🎯","Recruitment","Tuyển dụng từ A–Z: JD, sourcing, phỏng vấn, offer.","6 tuần · 24 buổi","1.990.000 ₫"],["💰","C&B","Tiền lương, BHXH, thuế TNCN, thang bảng lương.","8 tuần · 30 buổi","2.490.000 ₫"],["🗂️","HR Operations","Hợp đồng, hồ sơ, onboarding, nội quy, chấm công.","5 tuần · 20 buổi","1.790.000 ₫"],["📊","HR Analytics","Dashboard nhân sự, turnover, Excel &amp; Power BI cơ bản.","6 tuần · 22 buổi","2.290.000 ₫"]];
const LESSONS={"Recruitment":["Hiểu quy trình tuyển dụng","Viết JD thu hút","Sourcing trên LinkedIn","Sàng lọc CV","Phỏng vấn STAR","Offer &amp; onboarding"],"C&B":["Cấu trúc lương 3P","Tính lương Gross–Net","BHXH, BHYT, BHTN","Thuế TNCN","Làm thêm giờ &amp; phép","Quyết toán cuối năm"]};
const DOCS=[["Biểu mẫu","Mẫu hợp đồng lao động 2026","docx"],["Biểu mẫu","Mẫu quyết định thử việc","docx"],["Quy trình","Quy trình tuyển dụng 7 bước","pdf"],["Quy trình","Quy trình onboarding 30 ngày","pdf"],["Excel","File Excel bảng lương mẫu","xlsx"],["Excel","Bảng theo dõi tuyển dụng (ATS mini)","xlsx"],["Biểu mẫu","Mẫu đánh giá thử việc","docx"],["Excel","Dashboard turnover tháng","xlsx"]];
const POSTS=[["Kinh nghiệm","5 sai lầm HR Newbie hay mắc trong 3 tháng đầu","Từ việc không đọc kỹ luật đến ngại hỏi sếp – cách tránh từng lỗi."],["Tình huống","Ứng viên nhận offer rồi bỏ ngang: HR xử lý thế nào?","Phân tích tình huống thật và 4 bước giữ chân ứng viên."],["Kiến thức","Chuyển ngành sang HR: lộ trình 90 ngày cho người mới","Học gì trước, làm dự án nhỏ nào để có portfolio."],["C&amp;B","Gross sang Net: giải thích bằng ví dụ dễ hiểu","Một bảng lương mẫu, từng dòng từng bước."]];
const st={cat:"Tất cả",q:"",tab:"salary",login:false,done:{}};
function nav(){const h=(location.hash||"#home").slice(1);$("#nv").innerHTML=NAV.map(n=>`<a href="#${n[0]}" class="${n[0]==h?"on":""}">${n[1]}</a>`).join("");$("#nv").classList.remove("open")}
const head=(t,s)=>`<section style="padding-bottom:0"><div class="w"><h2>${t}</h2><p class="sub">${s}</p></div></section>`;
const V={
home:()=>`<div class="hero"><div class="w two" style="align-items:center"><div><div style="display:flex;gap:12px;align-items:center;margin-bottom:14px"><div class="av">PH</div><div><b>Phạm Thị Hoa</b><div style="color:#b9d4ee;font-size:14px">Founder &amp; Mentor HR</div></div></div><h1>Xin chào các bạn Newbie! 👋<br><span style="color:#6ee7b7">Các bạn cần hỗ trợ gì?</span></h1><p>Học thực chiến với tình huống thật, biểu mẫu dùng ngay và mentor đồng hành 1:1 – dành cho sinh viên, người mới đi làm và người chuyển ngành.</p><p><a class="btn" href="#courses">Khám phá khóa học</a> &nbsp;<a class="btn o" href="#coaching">Đặt lịch tư vấn miễn phí</a></p><div class="stats"><div><b>1.200+</b>học viên (số mẫu)</div><div><b>4</b>chương trình</div><div><b>96%</b>hài lòng (số mẫu)</div></div></div><aside class="card" style="color:var(--tx)"><b style="font-size:18px">📅 Khóa học &amp; lớp sắp khai giảng</b><p class="mu" style="margin:2px 0 10px">Lịch mẫu cho bản demo</p>${[["05/12","Recruitment cho Newbie","Online · T3, T5 19:30"],["12/12","C&amp;B căn bản","Củ Chi · T7, CN"],["05/01","HR Operations thực chiến","Online · T2, T4 20:00"]].map(c=>`<a href="#courses" class="les"><span class="tag">${c[0]}</span><span><b>${c[1]}</b><br><span class="mu">${c[2]}</span></span></a>`).join("")}${COURSES.map(c=>`<a href="#courses" class="les"><span>${c[0]}</span><span><b>${c[1]}</b> <span class="mu">· ${c[3]}</span></span></a>`).join("")}<p style="margin:12px 0 0"><a class="btn" href="#coaching">Nhờ cô Hoa tư vấn</a></p></aside></div></div>
<section><div class="w"><h2>Vì sao chọn HOA HR ACADEM?</h2><p class="sub">Mọi thứ HR Newbie cần, gói gọn trong một nơi.</p><div class="grid">${[["🧭","Lộ trình rõ ràng","Từ con số 0 đến việc làm đầu tiên trong 90 ngày."],["🛠️","Thực chiến 100%","Làm bài tập trên dữ liệu và tình huống doanh nghiệp thật."],["🤝","Mentor đồng hành","Coaching 1:1, chữa CV và luyện phỏng vấn HR."],["📚","Kho tài liệu","Biểu mẫu, quy trình, file Excel tải về dùng ngay."]].map(c=>`<div class="card"><div class="ic">${c[0]}</div><b>${c[1]}</b><p class="mu">${c[2]}</p></div>`).join("")}</div></div></section>
<section><div class="w"><h2>Chương trình đào tạo</h2><p class="sub">Bốn mảng cốt lõi của nghề HR.</p><div class="grid">${COURSES.map(c=>`<a href="#courses" class="card"><div class="ic">${c[0]}</div><b>${c[1]}</b><p class="mu">${c[2]}</p><span class="tag">${c[3]}</span></a>`).join("")}</div></div></section>
<section><div class="w"><h2>Học viên nói gì</h2><p class="sub">Nhận xét mẫu cho bản demo.</p><div class="grid">${[["Ngọc Anh","Sinh viên năm cuối","Mình có offer HR Intern sau khi học xong khóa Recruitment."],["Minh Tuấn","Chuyển ngành từ Sales","Biểu mẫu và coaching giúp mình tự tin phỏng vấn."],["Thu Trang","C&B Junior","Chốt lương nhanh hơn hẳn nhờ bộ file Excel."]].map(c=>`<div class="card"><div style="color:#f59e0b">★★★★★</div><p>“${c[2]}”</p><b>${c[0]}</b><div class="mu">${c[1]}</div></div>`).join("")}</div></div></section>`,
courses:()=>head("Khóa học HR","Chọn mảng bạn muốn bắt đầu. Đăng ký và thanh toán chỉ là mô phỏng.")+`<section><div class="w grid">${COURSES.map((c,i)=>`<div class="card"><div class="ic">${c[0]}</div><b style="font-size:18px">${c[1]}</b><p class="mu">${c[2]}</p><span class="tag">${c[3]}</span><p><b style="color:var(--em2)">${c[4]}</b></p><button class="btn" onclick="enroll(${i})">Đăng ký (demo)</button></div>`).join("")}</div></section>`,
library:()=>{const cats=["Tất cả","Biểu mẫu","Quy trình","Excel"];const l=DOCS.filter(d=>(st.cat=="Tất cả"||d[0]==st.cat)&&d[1].toLowerCase().includes(st.q.toLowerCase()));return head("Thư viện HR","Biểu mẫu, quy trình và file Excel thực hành – tải về dùng ngay.")+`<section><div class="w"><input id="sq" placeholder="🔍 Tìm tài liệu..." value="${st.q}" oninput="st.q=this.value;draw(1)"><div class="tabs">${cats.map(c=>`<button class="${c==st.cat?"on":""}" onclick="st.cat='${c}';draw()">${c}</button>`).join("")}</div><div class="grid">${l.map(d=>`<div class="card"><span class="tag">${d[0]}</span><p><b>${d[1]}</b></p><span class="mu">.${d[2]} · miễn phí (mẫu)</span><p><button class="btn d" onclick="T('Demo: tệp tải về chưa có thật')">⬇ Tải về</button></p></div>`).join("")||"<p>Không tìm thấy.</p>"}</div></div></section>`},
toolkit:()=>{const tabs=[["salary","Lương Gross→Net"],["bhxh","BHXH"],["kpi","KPI"],["rec","Chỉ số tuyển dụng"]];const f={salary:`<label>Lương Gross (₫)</label><input id="g" type="number" value="20000000"><label>Số người phụ thuộc</label><input id="dp" type="number" value="0" min="0">`,bhxh:`<label>Mức lương đóng BHXH (₫)</label><input id="g" type="number" value="15000000">`,kpi:`<label>Kết quả thực tế</label><input id="a" type="number" value="85"><label>Mục tiêu</label><input id="b" type="number" value="100"><label>Trọng số (%)</label><input id="w" type="number" value="40">`,rec:`<label>Tổng ứng viên</label><input id="a" type="number" value="200"><label>Số được phỏng vấn</label><input id="b" type="number" value="40"><label>Số nhận offer</label><input id="c" type="number" value="8"><label>Số nhận việc</label><input id="d" type="number" value="6"><label>Tổng chi phí tuyển (₫)</label><input id="e" type="number" value="18000000">`}[st.tab];return head("HR Toolkit","Công cụ tính nhanh. Công thức và mức trần chỉ là minh họa, cần cập nhật theo luật khi triển khai thật.")+`<section><div class="w"><div class="tabs">${tabs.map(t=>`<button class="${t[0]==st.tab?"on":""}" onclick="st.tab='${t[0]}';draw()">${t[1]}</button>`).join("")}</div><div class="card" style="max-width:520px">${f}<button class="btn" onclick="calc()">Tính ngay</button><div id="out"></div></div></div></section>`},
coaching:()=>head("Coaching 1:1","Mentor kèm riêng: định hướng, chữa CV, luyện phỏng vấn, xử lý tình huống công việc.")+`<section><div class="w two"><div><div class="card"><div style="display:flex;gap:14px;align-items:center"><div class="av">PH</div><div><b>Phạm Thị Hoa</b><div class="mu">Founder &amp; Mentor HR (hồ sơ mẫu)</div></div></div><p class="mu">Nhiều năm kinh nghiệm nhân sự thực tế, đồng hành cùng HR Newbie xây nền tảng vững và có việc làm đầu tiên.</p></div><div class="grid" style="margin-top:16px">${[["Khởi động","1 buổi · 60 phút","490.000 ₫"],["Tăng tốc","4 buổi · 1 tháng","1.690.000 ₫"],["Đồng hành","12 buổi · 3 tháng","4.490.000 ₫"]].map(p=>`<div class="card"><b>${p[0]}</b><div class="mu">${p[1]}</div><b style="color:var(--em2)">${p[2]}</b></div>`).join("")}</div></div><div class="card"><b>Đăng ký tư vấn miễn phí</b><p class="mu">Biểu mẫu demo – không gửi dữ liệu đi đâu.</p><div id="cf"><label>Họ tên</label><input id="n"><label>Email / Zalo</label><input id="e"><label>Bạn đang ở giai đoạn nào?</label><select><option>Sinh viên</option><option>Mới đi làm HR</option><option>Chuyển ngành</option></select><button class="btn" onclick="sub()">Gửi đăng ký</button></div></div></div></section>`,
blog:()=>head("Blog HR","Chia sẻ kiến thức, kinh nghiệm và tình huống thực tế.")+`<section><div class="w grid">${POSTS.map((p,i)=>`<div class="card"><span class="tag">${p[0]}</span><p><b style="font-size:18px">${p[1]}</b></p><p class="mu">${p[2]}</p><a href="javascript:void 0" onclick="T('Demo: nội dung bài viết sẽ có khi triển khai')" style="color:var(--em2);font-weight:700">Đọc bài →</a></div>`).join("")}</div></section>`,
student:()=>{if(!st.login)return head("Khu vực học viên","Đăng nhập demo để xem lộ trình và tiến độ.")+`<section><div class="w"><div class="card" style="max-width:400px"><label>Email</label><input value="hocvien@demo.vn"><label>Mật khẩu</label><input type="password" value="123456"><button class="btn" onclick="st.login=true;draw()">Đăng nhập (demo)</button></div></div></section>`;const all=Object.entries(LESSONS);const tot=12,dn=Object.values(st.done).filter(Boolean).length;return head("Chào Ngọc Anh 👋","Lộ trình HR Newbie 90 ngày (dữ liệu mẫu).")+`<section><div class="w"><div class="card"><b>Tiến độ tổng: ${Math.round(dn/tot*100)}%</b><div class="bar"><i style="width:${dn/tot*100}%"></i></div><p class="mu">${dn}/${tot} bài đã hoàn thành · bấm vào bài để đánh dấu</p></div><div class="grid" style="margin-top:16px">${all.map(([k,ls])=>`<div class="card"><b>${k}</b>${ls.map(l=>`<div class="les" onclick="st.done['${k+l}']=!st.done['${k+l}'];draw(1)"><input type="checkbox" ${st.done[k+l]?"checked":""}> <span>${l}</span></div>`).join("")}</div>`).join("")}</div><p><button class="btn d" onclick="st.login=false;draw()">Đăng xuất</button></p></div></section>`}};
function draw(keep){const h=(location.hash||"#home").slice(1);const A=$("#app");A.className=keep?"nf":"";A.innerHTML=(V[h]||V.home)();nav();if(keep){const e=$("#sq");if(e){e.focus();e.setSelectionRange(99,99)}}else if(!keep)window.scrollTo(0,0)}
function enroll(i){T("Demo: đã ghi nhận đăng ký khóa "+COURSES[i][1]+" – chưa thanh toán thật")}
function sub(){const n=$("#n").value||"bạn";$("#cf").innerHTML=`<div class="res"><b>✅ Cảm ơn ${n.replace(/</g,"")}!</b><br>Đây là bản demo, thông tin chưa được lưu hay gửi đi.</div>`}
function tax(t){const b=[[10e6,.05],[30e6,.1],[60e6,.2],[100e6,.3],[1e12,.35]];let r=0,p=0;for(const[x,q]of b){if(t>p)r+=(Math.min(t,x)-p)*q;p=x}return r}
const v=id=>+($("#"+id)||{}).value||0;
function calc(){let h="";const R=(a,b,c)=>`<div class="${c||""}"><span>${a}</span><span>${b}</span></div>`;
if(st.tab=="salary"){const g=v("g"),cap=46.8e6,bh=Math.min(g,cap)*.105,tn=Math.max(0,g-bh-15.5e6-v("dp")*6.2e6),tx=tax(tn);h=R("BHXH+BHYT+BHTN (10,5%)",fmt(bh))+R("Thu nhập tính thuế",fmt(tn))+R("Thuế TNCN",fmt(tx))+R("Lương Net",fmt(g-bh-tx),"t")}
if(st.tab=="bhxh"){const g=Math.min(v("g"),46.8e6);h=R("NLĐ đóng (10,5%)",fmt(g*.105))+R("Doanh nghiệp đóng (21,5%)",fmt(g*.215))+R("Tổng",fmt(g*.32),"t")}
if(st.tab=="kpi"){const p=v("b")?v("a")/v("b")*100:0;h=R("Tỷ lệ hoàn thành",p.toFixed(1)+"%")+R("Điểm quy đổi",(p*v("w")/100).toFixed(1)+" / "+v("w"),"t")}
if(st.tab=="rec"){const a=v("a")||1;h=R("Ứng viên → phỏng vấn",(v("b")/a*100).toFixed(1)+"%")+R("Phỏng vấn → offer",(v("c")/(v("b")||1)*100).toFixed(1)+"%")+R("Tỷ lệ chấp nhận offer",(v("d")/(v("c")||1)*100).toFixed(1)+"%")+R("Chi phí / 1 nhân sự",fmt(v("e")/(v("d")||1)),"t")}
$("#out").innerHTML=`<div class="res">${h}</div>`}
$("#bg").onclick=()=>$("#nv").classList.toggle("open");
(function(){if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;const c=document.createElement("canvas");c.id="st";document.body.appendChild(c);const x=c.getContext("2d");let P=[],W,H;const rs=()=>{W=c.width=innerWidth;H=c.height=innerHeight};rs();addEventListener("resize",rs);
const add=(px,py)=>{if(P.length>150)return;for(let i=0;i<2;i++)P.push({x:px,y:py,vx:(Math.random()-.5)*1.4,vy:Math.random()*1.2+.3,s:Math.random()*7+4,l:1,r:Math.random()*6,col:["#6ee7b7","#10b981","#ffffff","#fde68a"][Math.random()*4|0]})};
addEventListener("mousemove",e=>add(e.clientX,e.clientY));addEventListener("touchmove",e=>{const t=e.touches[0];add(t.clientX,t.clientY)},{passive:true});
function star(px,py,s,r){x.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4+r,d=i%2?s*.25:s;x.lineTo(px+Math.cos(a)*d,py+Math.sin(a)*d)}x.closePath();x.fill()}
(function loop(){x.clearRect(0,0,W,H);P=P.filter(p=>p.l>0);for(const p of P){p.x+=p.vx;p.y+=p.vy;p.l-=.02;p.r+=.05;x.globalAlpha=Math.max(p.l,0);x.fillStyle=p.col;star(p.x,p.y,p.s*p.l+1,p.r)}x.globalAlpha=1;requestAnimationFrame(loop)})()})();
addEventListener("hashchange",()=>draw());draw();
</script>
</body>
</html>
